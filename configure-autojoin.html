<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Joiner Configurator | Paxz Scriptz</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #050505; --card: rgba(12, 12, 16, 0.75); --accent: #8a2be2; --accent-glow: rgba(138, 43, 226, 0.4); --text: #ffffff; --text-dim: #a0a0a0; }
        
        * { box-sizing: border-box; }

        body { 
            background: linear-gradient(-45deg, #050505, #0d0614, #1a0b2e, #050505); 
            background-size: 400% 400%; 
            animation: bgShift 20s ease infinite; 
            color: var(--text); 
            font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif; 
            margin: 0; 
            height: 100vh; 
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #space-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .nebula-orb {
            position: fixed;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(138, 43, 226, 0.12) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            filter: blur(50px);
            animation: floatOrb 15s ease-in-out infinite alternate;
        }

        .nebula-orb.two {
            top: 60%;
            right: -10%;
            background: radial-gradient(circle, rgba(100, 20, 180, 0.1) 0%, transparent 70%);
            animation-duration: 20s;
            animation-direction: alternate-reverse;
        }
        
        nav { 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            padding: 10px 8%; 
            background: rgba(5, 5, 5, 0.85); 
            border-bottom: 1px solid rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(16px);
            z-index: 10;
        }

        .logo { font-size: 18px; font-weight: 800; text-decoration: none; color: white; text-transform: uppercase; letter-spacing: 1px; transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94); text-shadow: 0 0 5px rgba(138, 43, 226, 0.3); }
        .logo:hover { transform: scale(1.03); text-shadow: 0 0 15px rgba(138, 43, 226, 0.6); }
        .logo span { color: var(--accent); animation: glow 3s ease-in-out infinite; }

        .back-link {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
        }
        .back-link:hover { color: var(--accent); transform: translateX(-3px); }

        .container { flex-grow: 1; display: flex; align-items: center; justify-content: center; max-width: 480px; width: 100%; margin: 0 auto; padding: 15px; z-index: 10; }
        
        .config-wrapper { 
            background: var(--card); 
            backdrop-filter: blur(20px);
            padding: 22px 24px; 
            border-radius: 12px; 
            border: 1px solid rgba(138, 43, 226, 0.15); 
            box-shadow: 0 15px 35px rgba(0,0,0,0.6), 0 0 20px rgba(138, 43, 226, 0.1); 
            width: 100%;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .config-title {
            font-size: 1.05rem;
            font-weight: 800;
            margin-top: 0;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-shadow: 0 0 12px rgba(138, 43, 226, 0.4);
        }
        .config-title i { color: var(--accent); }

        .input-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 6px; color: var(--text-dim); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; }
        label i { margin-right: 5px; color: var(--accent); }
        
        input { 
            width: 100%; 
            padding: 10px 12px; 
            background: rgba(0, 0, 0, 0.6); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 6px; 
            color: white; 
            font-size: 12px; 
            font-family: inherit;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94); 
            box-sizing: border-box; 
        }
        input:focus { 
            border-color: var(--accent); 
            outline: none; 
            background: rgba(0, 0, 0, 0.8);
            box-shadow: 0 0 0 2px rgba(138, 43, 226, 0.25), 0 0 10px rgba(138, 43, 226, 0.2); 
        }

        .btn-gen { 
            width: 100%; 
            background: var(--accent); 
            color: white; 
            padding: 10px; 
            border-radius: 6px; 
            font-weight: 800; 
            border: none; 
            cursor: pointer; 
            font-size: 11px; 
            text-transform: uppercase; 
            letter-spacing: 0.8px;
            transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94); 
            box-shadow: 0 4px 12px rgba(138, 43, 226, 0.3);
            margin-top: 4px;
        }
        .btn-gen:hover { 
            transform: translateY(-2px) scale(1.02); 
            box-shadow: 0 6px 20px var(--accent-glow); 
            filter: brightness(1.1);
        }
        
        #result-section { margin-top: 16px; display: none; animation: fadeIn 0.5s ease; }
        
        .code-box { 
            background: rgba(0, 0, 0, 0.85); 
            border: 1px solid rgba(138, 43, 226, 0.3); 
            border-radius: 6px; 
            position: relative; 
            overflow: hidden;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.8);
        }
        
        textarea { 
            width: 100%; 
            height: 80px; 
            background: transparent; 
            color: #d0d0d0; 
            padding: 10px 12px; 
            border: none; 
            font-family: 'Consolas', 'Courier New', monospace; 
            font-size: 11px; 
            line-height: 1.4;
            resize: none; 
            outline: none; 
            box-sizing: border-box; 
        }
        
        .copy-btn { 
            position: absolute; 
            top: 6px; 
            right: 6px; 
            background: rgba(255, 255, 255, 0.08); 
            color: white; 
            border: 1px solid rgba(255, 255, 255, 0.15); 
            padding: 4px 10px; 
            border-radius: 4px; 
            cursor: pointer; 
            font-size: 9px; 
            font-weight: 700;
            letter-spacing: 0.8px;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94); 
        }
        .copy-btn:hover { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 8px var(--accent-glow); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes bgShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        @keyframes floatOrb { 0% { transform: translateY(0) scale(1); } 100% { transform: translateY(-20px) scale(1.05); } }
        @keyframes glow { 0% { text-shadow: 0 0 5px rgba(138, 43, 226, 0.3); } 50% { text-shadow: 0 0 20px rgba(138, 43, 226, 0.8); } 100% { text-shadow: 0 0 5px rgba(138, 43, 226, 0.3); } }
    </style>
</head>
<body>

    <canvas id="space-canvas"></canvas>
    <div class="nebula-orb"></div>
    <div class="nebula-orb two"></div>

    <nav>
        <a href="index.html" class="logo">Paxz<span>Scriptz</span></a>
        <a href="scripts.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Vault</a>
    </nav>

    <div class="container">
        <div class="config-wrapper">
            <h3 class="config-title"><i class="fas fa-users"></i> Auto Joiner Configurator</h3>
            
            <div class="input-group">
                <label><i class="fas fa-key"></i> Discord Token</label>
                <input type="text" id="val1" placeholder="Enter Account Token">
            </div>
            <div class="input-group">
                <label><i class="fas fa-hashtag"></i> Channel ID</label>
                <input type="text" id="val2" placeholder="Enter Target Channel ID">
            </div>

            <button class="btn-gen" onclick="generateCode()">Generate Code</button>

            <div id="result-section">
                <div class="code-box">
                    <button class="copy-btn" onclick="copyToClipboard()">COPY</button>
                    <textarea id="output-code" readonly></textarea>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('space-canvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const stars = Array.from({ length: 80 }, () => ({
            x: Math.random() * width,
            y: Math.random() * height,
            size: Math.random() * 1.5,
            speed: Math.random() * 0.2 + 0.05,
            alpha: Math.random()
        }));

        function animateStars() {
            ctx.clearRect(0, 0, width, height);
            stars.forEach(star => {
                star.y -= star.speed;
                if (star.y < 0) star.y = height;
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(Math.sin(Date.now() * 0.001 + star.alpha) * 0.7 + 0.3)})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
            requestAnimationFrame(animateStars);
        }
        animateStars();

        function generateCode() {
            const v1 = document.getElementById('val1').value;
            const v2 = document.getElementById('val2').value;
            let code = `_G.DISCORD_TOKEN = "${v1}"\n_G.CHANNEL_ID = "${v2}"\nloadstring(game:HttpGet('https://raw.githubusercontent.com/deltamokey-arch/PaxzScriptz/refs/heads/main/AutoJoiner.lua'))()`;
            document.getElementById('output-code').value = code;
            document.getElementById('result-section').style.display = 'block';
        }

        function copyToClipboard() {
            const c = document.getElementById("output-code"); 
            c.select(); 
            document.execCommand("copy"); 
            alert("Copied!");
        }
    </script>
</body>
</html>
